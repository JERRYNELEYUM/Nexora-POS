function cancelImport(){ pendingImportData = null; closeModal(); }

function confirmImport(){
  if(!pendingImportData) return;
  const modeInput = document.querySelector('input[name="import-mode"]:checked');
  const mode = modeInput ? modeInput.value : 'merge';
  if(mode==='replace'){
    if(!confirm('This will permanently erase all current data on this device and replace it with the backup file. This cannot be undone. Continue?')) return;
    replaceImportedDB(pendingImportData);
  }else{
    mergeImportedDB(pendingImportData);
  }
  pendingImportData = null;
}

function mergeArrayById(localArr, importedArr){
  const result = Array.isArray(localArr) ? localArr.slice() : [];
  (importedArr||[]).forEach(rec=>{
    if(!rec || !rec.id) return;
    const idx = result.findIndex(x=>x.id===rec.id);
    if(idx===-1){ result.push(rec); }
    else{
      const localUpdated = result[idx].updatedAt || result[idx].createdAt || 0;
      const importedUpdated = rec.updatedAt || rec.createdAt || 0;
      if(importedUpdated > localUpdated) result[idx] = rec;
    }
  });
  return result;
}

function mergeImportedDB(data){
  DB.products = mergeArrayById(DB.products, data.products);
  DB.customers = mergeArrayById(DB.customers, data.customers);
  DB.suppliers = mergeArrayById(DB.suppliers, data.suppliers);
  DB.sales = mergeArrayById(DB.sales, data.sales);
  DB.movements = mergeArrayById(DB.movements, data.movements);
  DB.staff = mergeArrayById(DB.staff, data.staff);
  DB.salaryPayments = mergeArrayById(DB.salaryPayments, data.salaryPayments);
  DB.expenses = mergeArrayById(DB.expenses, data.expenses);
  DB.supplies = mergeArrayById(DB.supplies, data.supplies);
  DB.customerPayments = mergeArrayById(DB.customerPayments, data.customerPayments);
  DB.supplierPayments = mergeArrayById(DB.supplierPayments, data.supplierPayments);
  DB.cashAdjustments = mergeArrayById(DB.cashAdjustments, data.cashAdjustments);
  (data.categories||[]).forEach(cat=>{ if(!DB.categories.includes(cat)) DB.categories.push(cat); });
  (data.expenseCategories||[]).forEach(cat=>{ if(!DB.expenseCategories.includes(cat)) DB.expenseCategories.push(cat); });
  if(data.meta && (data.meta.settingsUpdatedAt||0) > (DB.meta.settingsUpdatedAt||0)){
    DB.meta.storeName = data.meta.storeName || DB.meta.storeName;
    DB.meta.taxRate = data.meta.taxRate!=null ? data.meta.taxRate : DB.meta.taxRate;
    DB.meta.settingsUpdatedAt = data.meta.settingsUpdatedAt;
  }
  // add any staff logins this device doesn't already have; never overwrite an existing local login
  (data.users||[]).forEach(u=>{
    if(!DB.users.find(x=>x.id===u.id)) DB.users.push(u);
  });
  // keep this device's ID counters moving forward only, to avoid future SKU/receipt collisions
  if(data.nextIds){
    Object.keys(data.nextIds).forEach(k=>{
      DB.nextIds[k] = Math.max(DB.nextIds[k]||1, data.nextIds[k]||1);
    });
  }
  saveDB();
  toast('Backup merged into current data — reloading…','success');
  setTimeout(()=>location.reload(), 900);
}

function replaceImportedDB(data){
  const freshDeviceId = makeDeviceId();
  DB = data;
  if(!DB.session) DB.session = {userId:null, cart:[], heldSales:[]};
  if(!DB.sync) DB.sync = {enabled:false, backendUrl:'', syncKey:'', lastSyncedAt:0, status:'idle', lastError:''};
  DB.sync.deviceId = freshDeviceId; // always assign this device a fresh identity, even on restore
  DB.sync.status = 'idle';
  DB.sync.lastError = '';
  saveDB();
  toast('Data replaced from backup — reloading…','success');
  setTimeout(()=>location.reload(), 900);
}

/* ============================================================
   BACKEND SYNC — Netlify Functions + Supabase
   Optional. App works fully offline without this configured.
   Same architecture as Nexora Stay: push/pull, last-write-wins
   by updatedAt, shared sync key per store. PINs never sync —
   each till keeps its own local users/PINs for security.
   ============================================================ */
const SYNC_ENTITIES = ['products','customers','suppliers','sales','movements','staff','salaryPayments','expenses','supplies','customerPayments','supplierPayments','cashAdjustments'];
let syncTimer = null;
let syncInFlight = false;

function collectionUpdatedSince(list, since){
  return (list||[]).filter(r=>(r.updatedAt||r.createdAt||0) > since);
}

async function runSync(silent){
  if(!DB.sync.enabled || !DB.sync.backendUrl || !DB.sync.syncKey){
    if(!silent) toast('Set a backend URL and sync key first','error');
    return;
  }
  if(syncInFlight) return;
  syncInFlight = true;
  DB.sync.status = 'syncing';
  DB.sync.lastError = '';
  if(currentView==='settings') renderSyncStatus();

  const since = DB.sync.lastSyncedAt || 0;
  const payload = { syncKey: DB.sync.syncKey, deviceId: DB.sync.deviceId, since, changes:{} };
  SYNC_ENTITIES.forEach(ent=>{ payload.changes[ent] = collectionUpdatedSince(DB[ent], since); });
  if(DB.meta.settingsUpdatedAt > since){
    payload.changes.storeMeta = [{ id:'meta', storeName:DB.meta.storeName, address:DB.meta.address, phone:DB.meta.phone, email:DB.meta.email, taxPayerNumber:DB.meta.taxPayerNumber, registrationNumber:DB.meta.registrationNumber, taxRate:DB.meta.taxRate, categories:DB.categories, expenseCategories:DB.expenseCategories, updatedAt:DB.meta.settingsUpdatedAt }];
  }else{
    payload.changes.storeMeta = [];
  }

  try{
    const res = await fetch(DB.sync.backendUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const errText = await res.text().catch(()=> res.statusText);
      throw new Error(`Server responded ${res.status}: ${errText.slice(0,200)}`);
    }
    const data = await res.json();
    mergeIncoming(data.changes || {});
    DB.sync.lastSyncedAt = data.serverTime || Date.now();
    DB.sync.status = 'idle';
    DB.sync.lastError = '';
    saveDB();
    if(!silent) toast('Synced successfully','success');
  }catch(e){
    console.error('Sync failed', e);
    DB.sync.status = 'error';
    DB.sync.lastError = e.message || String(e);
    saveDB();
    if(!silent) toast('Sync failed: '+DB.sync.lastError,'error');
  }finally{
    syncInFlight = false;
    if(currentView==='settings') renderSyncStatus();
    if(['pos','inventory','dashboard','sales','customers','suppliers','payroll','expenses'].includes(currentView)){
      // refresh view if data may have changed under the user
      const renderers = {pos:renderPOS, inventory:renderInventory, dashboard:renderDashboard, sales:renderSales, customers:renderCustomers, suppliers:renderSuppliers, payroll:renderPayroll, expenses:renderExpenses};
      if(renderers[currentView]) renderers[currentView]();
    }
  }
}

function mergeIncoming(changes){
  SYNC_ENTITIES.forEach(ent=>{
    const incoming = changes[ent];
    if(!incoming || !incoming.length) return;
    const local = DB[ent];
    incoming.forEach(rec=>{
      const idx = local.findIndex(x=>x.id===rec.id);
      if(idx===-1){
        local.push(rec);
      }else{
        const localUpdated = local[idx].updatedAt || local[idx].createdAt || 0;
        const incomingUpdated = rec.updatedAt || rec.createdAt || 0;
        if(incomingUpdated > localUpdated){
          local[idx] = rec;
        }
      }
    });
  });
  if(changes.storeMeta && changes.storeMeta.length){
    const m = changes.storeMeta[0];
    if(m.updatedAt > (DB.meta.settingsUpdatedAt||0)){
      DB.meta.storeName = m.storeName;
      DB.meta.address = m.address!=null ? m.address : DB.meta.address;
      DB.meta.phone = m.phone!=null ? m.phone : DB.meta.phone;
      DB.meta.email = m.email!=null ? m.email : DB.meta.email;
      DB.meta.taxPayerNumber = m.taxPayerNumber!=null ? m.taxPayerNumber : DB.meta.taxPayerNumber;
      DB.meta.registrationNumber = m.registrationNumber!=null ? m.registrationNumber : DB.meta.registrationNumber;
      DB.meta.taxRate = m.taxRate;
      DB.categories = m.categories;
      DB.expenseCategories = m.expenseCategories || DB.expenseCategories;
      DB.meta.settingsUpdatedAt = m.updatedAt;
    }
  }
}

function startAutoSync(){
  if(syncTimer) clearInterval(syncTimer);
  if(!DB.sync.enabled) return;
  syncTimer = setInterval(()=>runSync(true), 45000);
  runSync(true);
}

  const s = DB.sync;

  const statusColor = s.status==='error' ? 'var(--red-500)' : s.enabled ? 'var(--green-500)' : 'var(--ink-dim)';
  return `
    <div class="card">
      <div class="card-head"><div class="card-title">Backend Sync (Multi-Till)</div></div>
      <div class="card-body">
        <div style="font-size:12px;color:var(--ink-dim);margin-bottom:14px;line-height:1.5;">
          Optional. Connects this till to a shared backend so sales and stock stay in sync across multiple registers or devices. Works fully offline when disabled or unreachable — nothing here is required to use the POS.
        </div>
        ${isAdmin() ? `
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:14px;cursor:pointer;">
          <input type="checkbox" id="sync-enabled" ${s.enabled?'checked':''} style="width:16px;height:16px;">
          Enable backend sync
        </label>
        <div class="field"><label>Backend Function URL</label><input type="text" id="sync-url" value="${s.backendUrl||''}" placeholder="https://your-site.netlify.app/.netlify/functions/sync"></div>
        <div class="field"><label>Sync Key (shared with this store's other tills)</label><input type="text" id="sync-key" value="${s.syncKey||''}" placeholder="Provided when the backend is set up"></div>
        ` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;">
          <div style="font-size:12px;color:var(--ink-dim);">
            This device: <strong>${s.deviceId}</strong><br>
            Status: <span style="color:${statusColor};font-weight:700;" id="sync-status-label">${statusLabel}</span><br>
            Last synced: <span id="sync-last">${s.lastSyncedAt ? new Date(s.lastSyncedAt).toLocaleString('en-GB') : 'Never'}</span>
          </div>
        </div>
        ${s.lastError ? `<div style="font-size:11.5px;color:var(--red-500);margin-bottom:12px;">${s.lastError}</div>` : ''}
        <div style="display:flex;gap:8px;">
          ${isAdmin() ? `<button class="btn btn-teal" onclick="saveSyncSettings()">${ICONS.check} Save & Test</button>` : ''}
          ${s.enabled ? `<button class="btn btn-ghost" onclick="runSync(false)">${ICONS.refresh} Sync Now</button>` : ''}
        </div>
        <div style="font-size:11px;color:var(--ink-dim);margin-top:12px;">
          Staff PINs and users are never synced — each till keeps its own login for security.
        </div>
      </div>
    </div>
  `;
}
function renderSyncStatus(){
  const label = document.getElementById('sync-status-label');
  const last = document.getElementById('sync-last');
  if(label) { label.textContent = DB.sync.status==='syncing'?'Syncing…':DB.sync.status==='error'?'Error':(DB.sync.enabled?'Idle — connected':'Off'); }
  if(last) last.textContent = DB.sync.lastSyncedAt ? new Date(DB.sync.lastSyncedAt).toLocaleString('en-GB') : 'Never';
}
function saveSyncSettings(){
  const enabled = document.getElementById('sync-enabled').checked;
  const backendUrl = document.getElementById('sync-url').value.trim();
  const syncKey = document.getElementById('sync-key').value.trim();
  if(enabled && (!backendUrl || !syncKey)){
    toast('Enter both a backend URL and sync key to enable sync','error');
    return;
  }
  DB.sync.enabled = enabled;
  DB.sync.backendUrl = backendUrl;
  DB.sync.syncKey = syncKey;
  saveDB();
  toast('Sync settings saved','success');
  if(enabled){
    startAutoSync();
  }else{
    if(syncTimer) clearInterval(syncTimer);
  }
  renderSettings();
}

if(DB.sync.enabled) startAutoSync();
</script>
<script>
/* ---------- PWA: offline install support (isolated from app code) ---------- */
(function () {
  try {
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
      });
    }

    // Ask the browser not to evict localStorage (sales, stock, customers) under storage pressure.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }

    var btn = document.getElementById('install-btn');
    var iosHint = document.getElementById('install-ios');
    var deferred = null;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      if (btn && !standalone) btn.style.display = 'block';
    });
    if (btn) {
      btn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.then(function () { deferred = null; btn.style.display = 'none'; }).catch(function () {});
      });
    }
    window.addEventListener('appinstalled', function () { if (btn) btn.style.display = 'none'; });

    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIOS && !standalone && iosHint) iosHint.style.display = 'block';
  } catch (err) { console.warn('PWA setup skipped', err); }
})();
</script>
</body>
