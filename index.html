<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1f38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexora POS">
<title>Nexora POS &amp; Inventory — Supermarket</title>
<style>
  :root{
    --navy-950:#0a1628;
    --navy-900:#0f1f38;
    --navy-800:#152a4a;
    --navy-700:#1c3a63;
    --navy-600:#254a7d;
    --teal-500:#0d9488;
    --teal-400:#14b8a6;
    --teal-300:#5eead4;
    --amber-500:#f0a83c;
    --amber-600:#d98e1f;
    --red-500:#e2504a;
    --green-500:#2ea86e;
    --paper:#f6f7f5;
    --paper-dim:#eceeea;
    --ink:#0f1f38;
    --ink-dim:#5c6b7a;
    --line:#dde2e0;
    --white:#ffffff;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(10,22,40,0.06);
    --shadow-md:0 4px 16px rgba(10,22,40,0.10);
    --shadow-lg:0 12px 32px rgba(10,22,40,0.18);
    --mono:'SF Mono',ui-monospace,'Roboto Mono',Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c7cdc9;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  #app{height:100vh;width:100vw;display:none;}
  #app.ready{display:flex;}

  /* ---------- LOGIN SCREEN ---------- */
  #login-screen{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 15%, rgba(20,184,166,0.14), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(240,168,60,0.10), transparent 45%),
      linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-800) 100%);
    display:flex;align-items:center;justify-content:center;
    z-index:1000;
  }
  .login-card{
    width:380px;max-width:92vw;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:38px 34px 30px;
    backdrop-filter:blur(6px);
    animation:cardIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .brand-mark{
    display:flex;align-items:center;gap:10px;margin-bottom:26px;
  }
  .brand-glyph{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(135deg,var(--teal-400),var(--teal-500));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--navy-950);font-size:17px;
    box-shadow:0 4px 14px rgba(20,184,166,0.35);
  }
  .brand-text{color:#fff;}
  .brand-text .name{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand-text .tag{font-size:11px;color:var(--teal-300);letter-spacing:.4px;text-transform:uppercase;}
  .login-title{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px;}
  .login-sub{color:#9fb0c3;font-size:13px;margin-bottom:26px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin:22px 0 26px;}
  .pin-dot{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    transition:all .15s ease;
  }
  .pin-dot.filled{background:var(--teal-400);border-color:var(--teal-400);box-shadow:0 0 12px rgba(20,184,166,0.6);}
  .pin-dot.err{background:var(--red-500);border-color:var(--red-500);animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-key{
    height:56px;border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    color:#fff;font-size:19px;font-weight:600;
    transition:all .12s ease;
  }
  .pin-key:active{transform:scale(.94);background:rgba(20,184,166,0.25);}
  .pin-key.wide{grid-column:span 1;font-size:13px;color:#9fb0c3;}
  .login-users{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}
  .login-user-chip{
    flex:1;min-width:100px;
    padding:10px 12px;border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    color:#c7d2de;font-size:12.5px;text-align:left;
    display:flex;align-items:center;gap:8px;
    transition:all .15s ease;
  }
  .login-user-chip:hover{background:rgba(20,184,166,0.12);border-color:rgba(20,184,166,0.3);color:#fff;}
  .login-user-chip.active{background:rgba(20,184,166,0.18);border-color:var(--teal-400);color:#fff;}
  .chip-avatar{
    width:22px;height:22px;border-radius:50%;
    background:var(--navy-700);display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;flex-shrink:0;
  }
  .login-msg{text-align:center;font-size:12.5px;color:var(--red-500);height:16px;margin-bottom:6px;font-weight:600;}
  .login-foot{text-align:center;margin-top:22px;font-size:10.5px;color:#5c7089;letter-spacing:.3px;}

  /* ---------- APP SHELL ---------- */
  #app{width:100%;}
  .shell{display:flex;width:100%;height:100%;}
  .sidebar{
    width:76px;background:var(--navy-950);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0;flex-shrink:0;
    border-right:1px solid rgba(255,255,255,0.06);
  }
  .side-logo{
    width:38px;height:38px;border-radius:9px;
    background:linear-gradient(135deg,var(--teal-400),var(--teal-500));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--navy-950);font-size:16px;margin-bottom:26px;
    flex-shrink:0;
  }
  .side-nav{display:flex;flex-direction:column;gap:6px;flex:1;width:100%;align-items:center;}
  .nav-btn{
    width:56px;height:56px;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:#7c8ba0;font-size:9.5px;font-weight:600;letter-spacing:.2px;
    transition:all .15s ease;
  }
  .nav-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .nav-btn:hover{background:rgba(255,255,255,0.05);color:#c7d2de;}
  .nav-btn.active{background:rgba(20,184,166,0.14);color:var(--teal-300);}
  .nav-btn.active::before{content:'';position:absolute;}
  .side-foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:auto;}
  .side-user{
    width:38px;height:38px;border-radius:50%;
    background:var(--navy-700);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(20,184,166,0.4);
  }
  .side-logout{color:#7c8ba0;font-size:9px;font-weight:600;}
  .side-logout:hover{color:var(--red-500);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden;}
  .topbar{
    height:58px;flex-shrink:0;
    background:var(--white);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;
  }
  .topbar-title{font-size:16.5px;font-weight:700;color:var(--ink);}
  .topbar-sub{font-size:11.5px;color:var(--ink-dim);font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .store-badge{
    font-size:11px;font-weight:700;color:var(--teal-500);
    background:rgba(13,148,136,0.08);padding:5px 10px;border-radius:7px;
    letter-spacing:.3px;
  }
  .clock{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}

  .view{flex:1;overflow-y:auto;padding:22px;}
  .view.no-pad{padding:0;}

  /* Buttons */
  .btn{
    padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:all .12s ease;
    white-space:nowrap;
  }
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .btn-primary{background:var(--navy-900);color:#fff;}
  .btn-primary:hover{background:var(--navy-800);}
  .btn-teal{background:var(--teal-500);color:#fff;}
  .btn-teal:hover{background:#0b7d72;}
  .btn-ghost{background:var(--paper-dim);color:var(--ink);}
  .btn-ghost:hover{background:#e2e5e1;}
  .btn-danger{background:rgba(226,80,74,0.1);color:var(--red-500);}
  .btn-danger:hover{background:rgba(226,80,74,0.18);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:var(--paper-dim);color:var(--ink-dim);flex-shrink:0;
  }
  .icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .icon-btn:hover{background:#e2e5e1;color:var(--ink);}

  /* Cards / stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow-sm);
  }
  .stat-label{font-size:11px;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .stat-value{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .stat-delta{font-size:11.5px;font-weight:600;margin-top:4px;}
  .stat-delta.up{color:var(--green-500);}
  .stat-delta.down{color:var(--red-500);}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-size:14px;font-weight:700;}
  .card-body{padding:18px;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px 14px;font-size:10.5px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--paper-dim);position:sticky;top:0;}
  td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  tr.tr-hover:hover{background:var(--paper-dim);}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px;}
  .pill-green{background:rgba(46,168,110,0.12);color:var(--green-500);}
  .pill-amber{background:rgba(240,168,60,0.15);color:var(--amber-600);}
  .pill-red{background:rgba(226,80,74,0.12);color:var(--red-500);}
  .pill-gray{background:var(--paper-dim);color:var(--ink-dim);}

  /* Inputs */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-size:13.5px;color:var(--ink);background:var(--white);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--teal-400);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-dim);fill:none;stroke-width:2;}
  .search-box input{padding-left:36px;}

  /* POS layout */
  .pos-layout{display:flex;height:100%;}
  .pos-catalog{flex:1;display:flex;flex-direction:column;min-width:0;padding:16px 18px;overflow:hidden;}
  .pos-cart{width:380px;flex-shrink:0;background:var(--white);border-left:1px solid var(--line);display:flex;flex-direction:column;}
  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;flex-shrink:0;}
  .cat-tab{padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--paper-dim);color:var(--ink-dim);white-space:nowrap;flex-shrink:0;}
  .cat-tab.active{background:var(--navy-900);color:#fff;}
  .product-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding-bottom:10px;}
  .product-card{
    background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px;
    display:flex;flex-direction:column;gap:6px;transition:all .12s ease;text-align:left;
  }
  .product-card:hover{border-color:var(--teal-400);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .product-card:active{transform:scale(.97);}
  .product-card.oos{opacity:.45;cursor:not-allowed;}
  .pc-icon{width:34px;height:34px;border-radius:8px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--teal-500);}
  .pc-name{font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink);}
  .pc-price{font-size:13px;font-weight:800;color:var(--navy-900);}
  .pc-stock{font-size:10px;color:var(--ink-dim);font-weight:600;}

  .cart-head{padding:16px 18px;border-bottom:1px solid var(--line);}
  .cart-cust{display:flex;align-items:center;justify-content:space-between;}
  .cart-items{flex:1;overflow-y:auto;padding:6px 12px;}
  .cart-item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--paper-dim);}
  .ci-name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .ci-price{font-size:11px;color:var(--ink-dim);}
  .ci-qty{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:22px;height:22px;border-radius:6px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .qty-btn:hover{background:#e2e5e1;}
  .ci-qtynum{width:22px;text-align:center;font-size:12.5px;font-weight:700;}
  .ci-total{font-size:12.5px;font-weight:800;width:64px;text-align:right;}
  .ci-remove{width:20px;height:20px;color:var(--red-500);opacity:.6;flex-shrink:0;}
  .ci-remove:hover{opacity:1;}
  .cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink-dim);gap:8px;padding:30px;text-align:center;}
  .cart-empty svg{width:40px;height:40px;stroke:#c7cdc9;fill:none;stroke-width:1.4;}
  .cart-summary{padding:16px 18px;border-top:1px solid var(--line);background:var(--paper-dim);}
  .sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-dim);margin-bottom:6px;}
  .sum-row.total{font-size:18px;font-weight:800;color:var(--ink);margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);}
  .pay-methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0;}
  .pay-method{padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);text-align:center;font-size:11px;font-weight:700;color:var(--ink-dim);}
  .pay-method.active{border-color:var(--teal-500);background:rgba(13,148,136,0.08);color:var(--teal-500);}
  .cart-actions{display:flex;gap:8px;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,22,40,0.5);
    display:none;align-items:center;justify-content:center;z-index:500;padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--white);border-radius:14px;width:480px;max-width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    animation:modalIn .2s cubic-bezier(.16,1,.3,1);
  }
  .modal.wide{width:640px;}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:15.5px;font-weight:700;}
  .modal-close{width:28px;height:28px;border-radius:8px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}
  .modal-body{padding:20px;}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  /* Toast */
  #toast-wrap{position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--navy-950);color:#fff;padding:12px 16px;border-radius:10px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;gap:10px;min-width:240px;
    animation:toastIn .25s cubic-bezier(.16,1,.3,1);
  }
  .toast.success{border-left:3px solid var(--green-500);}
  .toast.error{border-left:3px solid var(--red-500);}
  .toast.info{border-left:3px solid var(--teal-400);}
  @keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--ink-dim);text-align:center;gap:10px;}
  .empty-state svg{width:44px;height:44px;stroke:#c7cdc9;fill:none;stroke-width:1.4;}
  .low-stock-row{background:rgba(226,80,74,0.04);}
  .receipt{font-family:var(--mono);font-size:12px;line-height:1.6;color:#1a1a1a;padding:6px;}
  .receipt .center{text-align:center;}
  .receipt .divider{border-top:1px dashed #999;margin:8px 0;}
  .receipt .row{display:flex;justify-content:space-between;}
  .flt{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;background:var(--white);color:var(--ink);}
  .modal.xwide{width:920px;}
  /* Printable reports (shown in a preview modal and in #print-area when printing) */
  .pr-page{background:#fff;border-radius:8px;padding:22px;box-shadow:var(--shadow-sm);}
  .print-report{font-size:12px;color:#1a1a1a;line-height:1.45;}
  .print-report .pr-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #1a1a1a;padding-bottom:10px;margin-bottom:14px;}
  .print-report .pr-store{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
  .print-report .pr-title{font-size:15px;font-weight:800;}
  .print-report .pr-sub{font-size:11px;color:#555;}
  .print-report .pr-meta{font-size:11px;color:#555;margin:-4px 0 12px;}
  .print-report .pr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .print-report .pr-kpi{border:1px solid #ddd;border-radius:6px;padding:8px 10px;}
  .print-report .pr-kpi .l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#666;}
  .print-report .pr-kpi .v{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;}
  .print-report .pr-kpi .s{font-size:10px;color:#666;}
  .print-report .pr-section{margin-bottom:14px;break-inside:auto;}
  .print-report .pr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .print-report .pr-h2{font-size:12.5px;font-weight:800;margin-bottom:6px;}
  .print-report table{width:100%;border-collapse:collapse;font-size:11px;}
  .print-report th{position:static;background:#f2f2f2;color:#333;padding:5px 7px;font-size:9.5px;border-bottom:1px solid #bbb;}
  .print-report td{padding:4px 7px;border-bottom:1px solid #e3e3e3;color:#1a1a1a;}
  .print-report tr:last-child td{border-bottom:1px solid #e3e3e3;}

    staff:[],

}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('DB load failed', e); }
  return null;
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('DB save failed', e); alert('Storage error — data may not have saved. Storage might be full.'); }
}
function deviceTag(){ return DB.sync.deviceId.slice(-4); }
function nextSku(){ return 'SKU-'+deviceTag()+'-'+String(DB.nextIds.product++).padStart(4,'0'); }
function nextReceiptId(){ return 'INV-'+deviceTag()+'-'+String(DB.nextIds.sale++).padStart(5,'0'); }

  sample.forEach(([name,cat,cost,price,stock,reorder])=>{

      id:uid('p'), name, category:cat, sku:nextSku(),

let pinBuffer = '';
let selectedLoginUser = null;

function fmt(n){
  n = Math.round(n||0);
  return n.toLocaleString('en-US').replace(/,/g,' ');
}
function money(n){ return fmt(n) + ' XAF'; }
function nowStr(){ return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayLocalISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// The date a record is "for": the user-chosen date if set, otherwise when it was created (older records)
function recordTime(r){ return r.date ? new Date(r.date+'T12:00:00').getTime() : r.createdAt; }
function recordDateLabel(r){ return new Date(recordTime(r)).toLocaleDateString('en-GB'); }
// Sales: admin can backdate the day, but the time-of-day always stays the real moment it was rung up
function saleDisplayTime(sale){
  if(!sale.date) return sale.createdAt;
  const cd = new Date(sale.createdAt);
  const [y,m,d] = sale.date.split('-').map(Number);
  return new Date(y, m-1, d, cd.getHours(), cd.getMinutes(), cd.getSeconds(), cd.getMilliseconds()).getTime();
}
// Call after the product's stock has been updated. delta is the signed change (defaults from type).
function logMovement(productId, productName, type, qty, reason, delta){
  const now = Date.now();
  const p = DB.products.find(x=>x.id===productId);
  if(delta==null) delta = type==='OUT' ? -qty : qty;
  DB.movements.push({id:uid('m'), productId, productName, type, qty, delta, balanceAfter:p?p.stock:null, reason, userId:currentUser.id, userName:currentUser.name, createdAt:now, updatedAt:now});
}

/* ---------------- LOGIN ---------------- */
function renderLoginUsers(){
  const wrap = document.getElementById('login-users');
  wrap.innerHTML = '';
  DB.users.forEach(u=>{
    const chip = document.createElement('button');
    chip.className = 'login-user-chip' + (selectedLoginUser===u.id ? ' active':'');
    chip.innerHTML = `<span class="chip-avatar">${u.name[0]}</span><span>${u.name}<br><span style="opacity:.6;font-size:10.5px;">${roleLabel(u.role)}</span></span>`;
    chip.onclick = ()=>{ selectedLoginUser = u.id; pinBuffer=''; document.getElementById('login-msg').textContent=''; renderLoginUsers(); renderPinDots(); };
    wrap.appendChild(chip);
  });
}
function renderPinDots(){
  const wrap = document.getElementById('pin-dots');
  wrap.innerHTML = '';
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled':'');
    wrap.appendChild(d);
  }
}
function renderPinPad(){
  const pad = document.getElementById('pin-pad');
  pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','clr','0','del'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className = 'pin-key' + (k==='clr'||k==='del' ? ' wide':'');
    b.textContent = k==='clr' ? 'Clear' : k==='del' ? '⌫' : k;
    b.onclick = ()=>handlePinKey(k);
    pad.appendChild(b);
  });
}
function handlePinKey(k){
  if(!selectedLoginUser){
    document.getElementById('login-msg').textContent = 'Select your name first';
    return;
  }
  if(k==='clr'){ pinBuffer=''; renderPinDots(); return; }
  if(k==='del'){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer += k;
  renderPinDots();
  if(pinBuffer.length===4){
    const u = DB.users.find(x=>x.id===selectedLoginUser);
    if(u && u.pin === pinBuffer){
      loginAs(u);
    }else{
      document.getElementById('login-msg').textContent = 'Incorrect PIN';
      document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('err'));
      setTimeout(()=>{ pinBuffer=''; renderPinDots(); },420);
    }
  }
}
function loginAs(u){
  currentUser = u;
  DB.session.userId = u.id;
  saveDB();
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('ready');
  initApp();
}
function logout(){
  currentUser = null;
  DB.session.userId = null;
  DB.session.cart = [];
  saveDB();
  pinBuffer=''; selectedLoginUser=null;
  document.getElementById('app').classList.remove('ready');
  document.getElementById('login-screen').style.display='flex';
  renderLoginUsers(); renderPinDots(); renderPinPad();
}
renderLoginUsers(); renderPinDots(); renderPinPad();
document.addEventListener('keydown', e=>{
  if(document.getElementById('login-screen').style.display==='none') return;
  if(/^[0-9]$/.test(e.key)) handlePinKey(e.key);
  if(e.key==='Backspace') handlePinKey('del');
});

  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(30px)'; t.style.transition='all .25s'; setTimeout(()=>t.remove(),250); }, 2600);
}

const NAV_ITEMS = [

// Destructive/irreversible actions (delete, void, data replace, user & sync management) stay admin-only.
// Assistant Manager can view and operate everything else, but never these.
function isAdmin(){ return currentUser.role==='admin'; }
function canManage(){ return currentUser.role==='admin' || currentUser.role==='assistant'; }
function roleLabel(role){ return role==='assistant' ? 'Assistant Manager' : role==='admin' ? 'Admin' : 'Cashier'; }

function initApp(){
  DB.session.cart = DB.session.cart || [];
  renderShell();
  navigateTo(currentUser.role==='cashier' ? 'pos' : 'pos');
  setInterval(updateClock, 1000*30);
}

function renderShell(){
  const app = document.getElementById('app');
  const items = NAV_ITEMS.filter(n=>n.roles.includes(currentUser.role));
  app.innerHTML = `

function renderProductGrid(){
  const grid = document.getElementById('product-grid');
  if(!grid) return;
  const q = posSearch.trim().toLowerCase();
  let list = DB.products.filter(p=>p.active!==false);
  if(posSelectedCat!=='All') list = list.filter(p=>p.category===posSelectedCat);
  if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.barcode||'').includes(q));
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${ICONS.box}<div>No products found</div></div>`;
    return;
  }
  grid.innerHTML = list.map(p=>{
    const oos = p.stock<=0;
    return `
    <button class="product-card ${oos?'oos':''}" ${oos?'disabled':''} onclick="addToCart('${p.id}')">

      <div class="pc-name">${p.name}</div>
      <div class="pc-price">${money(p.sellPrice)}</div>
      <div class="pc-stock">${oos?'Out of stock':p.stock+' in stock'}</div>
    </button>`;
  }).join('');
}

function addToCart(productId){
  const p = DB.products.find(x=>x.id===productId);
  if(!p || p.stock<=0){ toast('Out of stock','error'); return; }
  const existing = cart().find(c=>c.productId===productId);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty+1 > p.stock){ toast('Not enough stock available','error'); return; }
  if(existing){ existing.qty += 1; }
  else{ cart().push({productId, name:p.name, price:p.sellPrice, qty:1}); }
  saveDB();
  renderCart();
}
function changeQty(productId, delta){
  const item = cart().find(c=>c.productId===productId);
  if(!item) return;
  const p = DB.products.find(x=>x.id===productId);
  const newQty = item.qty + delta;
  if(newQty<=0){ cart().splice(cart().indexOf(item),1); }
  else if(p && newQty > p.stock){ toast('Not enough stock available','error'); return; }
  else{ item.qty = newQty; }
  saveDB();
  renderCart();
}
function removeFromCart(productId){
  const idx = cart().findIndex(c=>c.productId===productId);
  if(idx>-1) cart().splice(idx,1);
  saveDB();
  renderCart();
}
function clearCart(){
  DB.session.cart = [];
  saveDB();
  renderCart();
}

function cartTotals(){
  const subtotal = cart().reduce((s,c)=>s+c.price*c.qty,0);
  return { subtotal, total: subtotal };
}

function updateBalanceDisplay(total){
  const paid = parseFloat(document.getElementById('partial-paid').value)||0;
  const balance = total - paid;
  const el = document.getElementById('balance-display');
  if(paid<=0){ el.textContent = 'No payment now — full amount will be owed'; el.style.color='var(--red-500)'; }
  else if(balance<=0){ el.textContent = 'This covers the full amount — not a partial payment'; el.style.color='var(--green-500)'; }
  else{ el.textContent = `Balance owed after this payment: ${money(balance)}`; el.style.color='var(--amber-600)'; }
}
function updateChangeDisplay(total){
  const received = parseFloat(document.getElementById('cash-received').value)||0;
  const change = received - total;
  const el = document.getElementById('change-display');
  el.style.color = change<0 ? 'var(--red-500)' : 'var(--green-500)';
  el.textContent = change<0 ? `Short by ${money(Math.abs(change))}` : `Change due: ${money(change)}`;
}

function completeSale(){
  const t = cartTotals();
  let amountPaid = t.total;
  let effectiveMethod = posPayMethod;
  if(posIncompletePayment){
    amountPaid = parseFloat(document.getElementById('partial-paid')?.value)||0;
    if(amountPaid<0){ toast('Amount paid cannot be negative','error'); return; }
    if(amountPaid>=t.total){ toast('That covers the full total — untick incomplete payment or pick a different method instead','error'); return; }
    if(posPayMethod==='credit' && amountPaid>0){
      effectiveMethod = document.getElementById('credit-deposit-method')?.value || 'cash';
    }
  }else if(posPayMethod==='cash'){
    const received = parseFloat(document.getElementById('cash-received')?.value)||0;
    if(received < t.total){ toast('Cash received is less than total due','error'); return; }
    amountPaid = received;
  }
  const balanceDue = Math.round(t.total - amountPaid);
  const items = JSON.parse(JSON.stringify(cart()));
  const now = Date.now();
  const saleDate = (currentUser.role==='admin' && document.getElementById('sale-date')?.value) || todayLocalISO();
  const paymentStatus = balanceDue<=0 ? 'paid' : (amountPaid<=0 ? 'credit' : 'partial');
  const sale = {
    id:nextReceiptId(),
    date:saleDate,
    items, subtotal:t.subtotal, total:t.total,
    paymentMethod: balanceDue>0 ? (amountPaid<=0 ? 'credit' : effectiveMethod) : effectiveMethod,
    reference: ((effectiveMethod==='momo'||effectiveMethod==='om') && !posIncompletePayment) ? (document.getElementById('momo-ref')?.value||'') : '',
    cashReceived: effectiveMethod==='cash' ? amountPaid : t.total,
    amountPaid, balanceDue,
    paymentStatus,
    customerId:posSelectedCustomer,
    cashierId:currentUser.id, cashierName:currentUser.name,
    createdAt:now, updatedAt:now, voided:false
  };
  // deduct stock + log movements
  items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      p.stock -= it.qty;
      p.updatedAt = Date.now();
      logMovement(p.id, p.name, 'OUT', it.qty, 'Sale '+sale.id);
    }
  });
  if(balanceDue>0){
    const cust = DB.customers.find(c=>c.id===sale.customerId);
    if(cust){ cust.balance = (cust.balance||0) + balanceDue; cust.updatedAt = Date.now(); }
  }
  DB.sales.push(sale);
  DB.session.cart = [];
  posIncompletePayment = false;
  posPayMethod = 'cash';
  saveDB();
  closeModal();
  toast(paymentStatus==='credit' ? `Sale recorded on credit — ${money(balanceDue)} owed` : balanceDue>0 ? `Sale recorded — ${money(balanceDue)} still owed` : 'Sale completed — '+money(t.total), balanceDue>0?'info':'success');
  showReceipt(sale.id);
  renderPOS();
}

/* ============================================================
   TIME PERIODS + PRINTABLE REPORTS (shared by Stock Movements & Reports)
   ============================================================ */
const PERIOD_OPTIONS = [
  ['today','Today'],['yesterday','Yesterday'],['this_week','This Week'],['last_7','Last 7 Days'],
  ['this_month','This Month'],['last_month','Last Month'],['last_30','Last 30 Days'],['last_90','Last 90 Days'],
  ['this_year','This Year'],['last_year','Last Year'],['all','All Time'],['custom','Custom Range…']
];
// Resolve a {period, from, to} filter into a [start, end) timestamp range plus a readable label
function periodRange(f){
  const addDays = (d,n)=>new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const y = today.getFullYear(), mo = today.getMonth();
  let s, e = addDays(today,1);
  switch(f.period){
    case 'today': s = today; break;
    case 'yesterday': s = addDays(today,-1); e = today; break;
    case 'this_week': s = addDays(today, -((today.getDay()+6)%7)); break; // weeks start Monday
    case 'last_7': s = addDays(today,-6); break;
    case 'this_month': s = new Date(y,mo,1); break;
    case 'last_month': s = new Date(y,mo-1,1); e = new Date(y,mo,1); break;
    case 'last_30': s = addDays(today,-29); break;
    case 'last_90': s = addDays(today,-89); break;
    case 'this_year': s = new Date(y,0,1); break;
    case 'last_year': s = new Date(y-1,0,1); e = new Date(y,0,1); break;
    case 'custom': {
      const a = f.from || todayLocalISO(), b = f.to || a;
      const [lo,hi] = a<=b ? [a,b] : [b,a];
      s = new Date(lo+'T00:00:00'); e = addDays(new Date(hi+'T00:00:00'),1); break;
    }
    default: return {start:-Infinity, end:Infinity, label:'All Time'};
  }
  const fd = d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const last = addDays(e,-1);
  const span = fd(s)===fd(last) ? fd(s) : fd(s)+' – '+fd(last);
  const opt = PERIOD_OPTIONS.find(o=>o[0]===f.period);
  return {start:s.getTime(), end:e.getTime(), label: f.period==='custom' ? span : `${opt[1]} (${span})`};
}
function inRange(t, r){ return t>=r.start && t<r.end; }
// Period dropdown (+ from/to dates when "Custom Range" is picked). stateName is the global filter object's name.
function periodPickerHtml(f, stateName, rerender){
  return `

      <input type="date" class="flt" value="${f.to||''}" onchange="${stateName}.to=this.value;${rerender}">` : ''}
  `;
}

let mvFilter = {period:'last_30', from:todayLocalISO(), to:todayLocalISO(), productId:'', type:'', view:'detail'};

// Signed stock change of a movement. Older adjustments only stored the size of the change, so count them as 0.
function mvDelta(m){
  if(m.delta!=null) return Number(m.delta);
  return m.type==='IN' ? m.qty : m.type==='OUT' ? -m.qty : 0;
}
function mvTypePill(m){
  if(m.type==='IN') return '<span class="pill pill-green">IN</span>';
  if(m.type==='OUT') return '<span class="pill pill-red">OUT</span>';
  return '<span class="pill pill-gray">ADJUST</span>';
}
function mvQtyLabel(m){
  const d = mvDelta(m);
  if(m.type==='ADJUSTMENT' && m.delta==null) return '±'+m.qty;
  return (d>0?'+':d<0?'−':'')+Math.abs(d);
}
// Chronological ledger of one product with the stock level before/after each movement.
// Walks back from the current stock, anchoring on recorded balances where available.
function productLedger(productId){
  const p = DB.products.find(x=>x.id===productId);
  const list = DB.movements.filter(m=>m.productId===productId).sort((a,b)=>a.createdAt-b.createdAt);
  const bal = new Map();
  let running = p ? Number(p.stock)||0 : 0;
  for(let i=list.length-1;i>=0;i--){
    const m = list[i];
    const after = m.balanceAfter!=null ? Number(m.balanceAfter) : running;
    const before = after - mvDelta(m);
    bal.set(m.id, {before, after});
    running = before;
  }
  return {list, bal, product:p};
}
// Stock level of a product just before moment t
function stockAt(ledger, t){
  let last = null;
  for(const m of ledger.list){ if(m.createdAt<t) last=m; else break; }
  if(last) return ledger.bal.get(last.id).after;
  if(ledger.list.length) return ledger.bal.get(ledger.list[0].id).before;
  return ledger.product ? Number(ledger.product.stock)||0 : 0;
}
function mvProductOptions(){
  const withMoves = new Set(DB.movements.map(m=>m.productId));
  return DB.products.filter(p=>p.active!==false || withMoves.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));
}
function getMovementReportData(){
  const range = periodRange(mvFilter);
  const list = DB.movements.filter(m=>inRange(m.createdAt, range)
    && (!mvFilter.productId || m.productId===mvFilter.productId)
    && (!mvFilter.type || m.type===mvFilter.type)).sort((a,b)=>b.createdAt-a.createdAt);
  const totIn = list.filter(m=>mvDelta(m)>0).reduce((s,m)=>s+mvDelta(m),0);
  const totOut = list.filter(m=>mvDelta(m)<0).reduce((s,m)=>s-mvDelta(m),0);
  const adjCount = list.filter(m=>m.type==='ADJUSTMENT').length;
  let ledger = null, opening = null, closing = null;
  if(mvFilter.productId){
    ledger = productLedger(mvFilter.productId);
    opening = stockAt(ledger, range.start);
    closing = stockAt(ledger, range.end);
  }
  // per-product summary
  const byProduct = {};
  list.forEach(m=>{
    const k = m.productId;
    if(!byProduct[k]) byProduct[k] = {productId:k, name:m.productName, count:0, inQ:0, outQ:0, adj:0, net:0};
    const b = byProduct[k], d = mvDelta(m);
    b.count++;
    if(m.type==='ADJUSTMENT') b.adj += d;
    else if(d>0) b.inQ += d; else b.outQ -= d;
    b.net += d;
  });
  const summary = Object.values(byProduct).sort((a,b)=>(b.inQ+b.outQ+Math.abs(b.adj))-(a.inQ+a.outQ+Math.abs(a.adj)));
  return {range, list, totIn, totOut, adjCount, ledger, opening, closing, summary, product: ledger?ledger.product:null};
}

function buildMovementReportHtml(){
  const d = getMovementReportData();
  const p = d.product;
  const typeLabel = {IN:'Stock In', OUT:'Stock Out', ADJUSTMENT:'Adjustments'}[mvFilter.type];
  const dt = m=>new Date(m.createdAt).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const typeTxt = m=>m.type==='ADJUSTMENT'?'ADJUST':m.type;
  const chrono = [...d.list].reverse();
  let body;
  if(p){
    const unit = p.unit ? ' '+p.unit : '';
    body = prKpis([
      ['Opening Stock', fmt(d.opening)+unit],
      ['Total In', '+'+fmt(d.totIn)],
      ['Total Out', '−'+fmt(d.totOut)],
      ['Closing Stock', fmt(d.closing)+unit, `Current: ${fmt(p.stock)}${unit}`]
    ]) + `<div class="pr-meta">Category: ${p.category||'—'} · SKU: ${p.sku||'—'}${typeLabel?' · Showing: '+typeLabel:''}</div>`
    + prTable('Movement History', ['Date','Type','Qty','Before','After','Reason','By'],
      chrono.map(m=>{ const b = d.ledger.bal.get(m.id); return [dt(m), typeTxt(m), mvQtyLabel(m), fmt(b.before), `<b>${fmt(b.after)}</b>`, m.reason, m.userName]; }),
      'No movements for this product in this period', [2,3,4]);
  }else{
    body = prKpis([
      ['Movements', fmt(d.list.length), `${d.summary.length} products`],
      ['Units In', '+'+fmt(d.totIn)],
      ['Units Out', '−'+fmt(d.totOut)],
      ['Adjustments', fmt(d.adjCount)]
    ]) + (typeLabel?`<div class="pr-meta">Showing: ${typeLabel}</div>`:'')
    + prTable('Summary by Product', ['Product','Moves','In','Out','Adjust','Net','Current Stock'],
      d.summary.map(b=>{ const prod = DB.products.find(x=>x.id===b.productId);
        return [b.name, b.count, b.inQ?'+'+fmt(b.inQ):'—', b.outQ?'−'+fmt(b.outQ):'—', b.adj?(b.adj>0?'+':'−')+fmt(Math.abs(b.adj)):'—', `<b>${b.net>0?'+':b.net<0?'−':''}${fmt(Math.abs(b.net))}</b>`, prod?fmt(prod.stock):'—']; }),
      'No movements in this period', [1,2,3,4,5,6])
    + prTable('All Movements', ['Date','Product','Type','Qty','Reason','By'],
      chrono.map(m=>[dt(m), m.productName, typeTxt(m), mvQtyLabel(m), m.reason, m.userName]),
      'No movements in this period', [3]);
  }
  return reportShell(p ? 'Product Movement Report' : 'Stock Movement Report', d.range.label, body, p ? p.name : '');
}
function viewMovementReport(){
  const p = mvFilter.productId ? DB.products.find(x=>x.id===mvFilter.productId) : null;

function saveProduct(productId){
  const name = document.getElementById('pf-name').value.trim();
  const category = document.getElementById('pf-category').value;
  const unit = document.getElementById('pf-unit').value.trim()||'unit';
  const costPrice = parseFloat(document.getElementById('pf-cost').value)||0;
  const sellPrice = parseFloat(document.getElementById('pf-price').value)||0;
  const stock = parseInt(document.getElementById('pf-stock').value)||0;
  const reorderLevel = parseInt(document.getElementById('pf-reorder').value)||0;
  const barcode = document.getElementById('pf-barcode').value.trim();
  if(!name){ toast('Product name is required','error'); return; }
  if(sellPrice<=0){ toast('Selling price must be greater than 0','error'); return; }

  if(productId){
    const p = DB.products.find(x=>x.id===productId);
    const stockDiff = stock - p.stock;
    Object.assign(p, {name, category, unit, costPrice, sellPrice, reorderLevel, barcode, updatedAt:Date.now()});
    if(stockDiff!==0){
      p.stock = stock;
      logMovement(p.id, p.name, 'ADJUSTMENT', Math.abs(stockDiff), 'Manual edit adjustment', stockDiff);
    }
    toast('Product updated','success');
  }else{
    const now = Date.now();
    const newP = {id:uid('p'), name, category, sku:nextSku(), barcode, costPrice, sellPrice, stock, reorderLevel, unit, active:true, createdAt:now, updatedAt:now};
    DB.products.push(newP);
    if(stock>0) logMovement(newP.id, newP.name, 'IN', stock, 'Initial stock');
    toast('Product added','success');
  }
  saveDB();
  closeModal();
  renderInventory();
}
function deleteProduct(productId){
  const p = DB.products.find(x=>x.id===productId);
  if(!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
  p.active = false;
  p.deleted = true;
  p.updatedAt = Date.now();
  saveDB();
  toast('Product deleted','info');
  renderInventory();
}

function openMovementModal(){
  openModal(`
    <div class="modal-head"><div class="modal-title">Record Stock Movement</div><button class="modal-close" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="field"><label>Product</label>
        <select id="mf-product">${DB.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${p.name} (current: ${p.stock})</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Type</label>
          <select id="mf-type" onchange="updateMovementQtyLabel()">
            <option value="IN">Stock In (restock)</option>
            <option value="OUT">Stock Out (damage/loss/use)</option>
            <option value="ADJUSTMENT">Adjustment (set exact count after stock take)</option>
          </select>
        </div>
        <div class="field"><label id="mf-qty-label">Quantity</label><input type="number" id="mf-qty" value="1" min="0" oninput="updateMovementQtyLabel()"></div>
      </div>
      <div class="field"><label>Reason / Note</label><input type="text" id="mf-reason" placeholder="e.g. Delivery from SABC, damaged goods..."></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-teal" onclick="saveMovement()">${ICONS.check} Record</button>
    </div>
  `);
  updateMovementQtyLabel();
}
function updateMovementQtyLabel(){
  const type = document.getElementById('mf-type')?.value;
  const label = document.getElementById('mf-qty-label');
  if(!label) return;
  label.textContent = type==='ADJUSTMENT' ? 'New Exact Stock Count' : 'Quantity';
}
function saveMovement(){
  const productId = document.getElementById('mf-product').value;
  const type = document.getElementById('mf-type').value;
  const qty = parseInt(document.getElementById('mf-qty').value)||0;
  const reason = document.getElementById('mf-reason').value.trim() || type;
  const p = DB.products.find(x=>x.id===productId);
  if(!p || qty<0){ toast('Enter a valid quantity','error'); return; }
  if(type==='OUT' && qty>p.stock){ toast('Cannot remove more than current stock','error'); return; }

  let logQty = qty, delta = type==='OUT' ? -qty : qty;
  if(type==='IN') p.stock += qty;
  else if(type==='OUT') p.stock -= qty;
  else { delta = qty - p.stock; logQty = Math.abs(delta); p.stock = qty; } // adjustment sets absolute value; log the delta
  p.updatedAt = Date.now();
  logMovement(p.id, p.name, type, logQty, reason, delta);
  saveDB();
  closeModal();
  toast('Stock movement recorded','success');
  renderInventory();
}

function isToday(ts){
  const d = new Date(ts), n = new Date();
  return d.getDate()===n.getDate() && d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
}
function isYesterday(ts){
  const y = new Date(); y.setDate(y.getDate()-1);
  const d = new Date(ts);
  return d.getDate()===y.getDate() && d.getMonth()===y.getMonth() && d.getFullYear()===y.getFullYear();
}
function renderDashboard(){
  const view = document.getElementById('view');
  const validSales = DB.sales.filter(s=>!s.voided);
  const todaySales = validSales.filter(s=>isToday(saleDisplayTime(s)));
  const ydaySales = validSales.filter(s=>isYesterday(saleDisplayTime(s)));
  const todayRevenue = todaySales.reduce((s,x)=>s+x.total,0);
  const ydayRevenue = ydaySales.reduce((s,x)=>s+x.total,0);
  const revDelta = ydayRevenue>0 ? ((todayRevenue-ydayRevenue)/ydayRevenue*100) : (todayRevenue>0?100:0);
  const todayCost = todaySales.reduce((s,sale)=>s+sale.items.reduce((ss,it)=>{
    const p = DB.products.find(x=>x.id===it.productId);
    return ss + (p?p.costPrice:0)*it.qty;
  },0),0);
  const todayProfit = todayRevenue - todayCost;
  const lowStock = DB.products.filter(p=>p.active!==false && p.stock<=p.reorderLevel);

  const since = Date.now() - 30*24*60*60*1000;
  const salesRecent = validSales.filter(s=>saleDisplayTime(s)>=since);
  const productTotals = {};
  salesRecent.forEach(s=>s.items.forEach(it=>{
    productTotals[it.productId] = (productTotals[it.productId]||0) + it.qty;
  }));
  const topProducts = Object.entries(productTotals).sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([pid,qty])=>({p:DB.products.find(x=>x.id===pid), qty}))
    .filter(x=>x.p);

  view.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Today's Revenue</div>
        <div class="stat-value">${money(todayRevenue)}</div>
        <div class="stat-delta ${revDelta>=0?'up':'down'}">${revDelta>=0?'▲':'▼'} ${Math.abs(revDelta).toFixed(0)}% vs yesterday</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Profit (est.)</div>
        <div class="stat-value">${money(todayProfit)}</div>
        <div class="stat-delta" style="color:var(--ink-dim);">${todaySales.length} sale${todaySales.length!==1?'s':''}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Products in Catalog</div>
        <div class="stat-value">${DB.products.length}</div>
        <div class="stat-delta" style="color:var(--ink-dim);">${DB.categories.length} categories</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Stock Alerts</div>
        <div class="stat-value" style="color:${lowStock.length>0?'var(--red-500)':'var(--ink)'}">${lowStock.length}</div>
        <div class="stat-delta" style="color:var(--ink-dim);">need reordering</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-head"><div class="card-title">Top Products (30 days)</div></div>
        <div class="card-body">
          ${topProducts.length===0 ? `<div class="empty-state">${ICONS.sales}<div>No sales yet this period</div></div>` :
          topProducts.map((tp,i)=>`
            <div style="display:flex;align-items:center;gap:12px;padding:9px 0;${i<topProducts.length-1?'border-bottom:1px solid var(--paper-dim);':''}">
              <div style="width:26px;height:26px;border-radius:7px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--teal-500);">${i+1}</div>
              <div style="flex:1;font-size:13px;font-weight:600;">${tp.p.name}</div>
              <div style="font-size:12.5px;color:var(--ink-dim);">${tp.qty} sold</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Needs Restocking</div></div>
        <div class="card-body">
          ${lowStock.length===0 ? `<div class="empty-state">${ICONS.check}<div>All stock levels healthy</div></div>` :
          lowStock.slice(0,6).map(p=>`
            <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-dim);">
              <div style="flex:1;font-size:13px;font-weight:600;">${p.name}</div>
              <span class="pill ${p.stock<=0?'pill-red':'pill-amber'}">${p.stock} left</span>
            </div>
          `).join('')}
          ${lowStock.length>0 ? `<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="navigateTo('inventory');invTab='lowstock';renderInventory();">View all ${lowStock.length}</button>`:''}
        </div>

function renderSalesTable(){
  const wrap = document.getElementById('sales-table-wrap');
  const now = Date.now();
  const cutoffs = {today:0, week:7*24*60*60*1000, month:30*24*60*60*1000, all:Infinity};

  if(salesDateFilter==='today') list = list.filter(s=>isToday(saleDisplayTime(s)));
  else if(salesDateFilter!=='all') list = list.filter(s=>now-saleDisplayTime(s)<=cutoffs[salesDateFilter]);
  if(salesSearch.trim()) list = list.filter(s=>s.id.toLowerCase().includes(salesSearch.trim().toLowerCase()));

  const total = list.filter(s=>!s.voided).reduce((s,x)=>s+x.total,0);

  wrap.innerHTML = `
    <table>
      <thead><tr><th>Receipt</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Cashier</th><th>Status</th><th></th></tr></thead>

        ${list.map(s=>`
          <tr class="tr-hover">
            <td style="font-weight:700;">${s.id}</td>

            <td>${s.items.reduce((n,i)=>n+i.qty,0)}</td>

            <td>
              <div style="display:flex;gap:6px;">
                <button class="icon-btn" title="View receipt" onclick="showReceipt('${s.id}')">${ICONS.print}</button>
                ${!s.voided && s.balanceDue>0 ? `<button class="icon-btn" title="Record balance settled" onclick="settleBalance('${s.id}')">${ICONS.check}</button>` : ''}
                ${currentUser.role==='admin' && !s.voided ? `<button class="icon-btn" title="Void sale" onclick="voidSale('${s.id}')">${ICONS.x}</button>` : ''}
              </div>
            </td>
          </tr>
        `).join('') || `<tr><td colspan="8"><div class="empty-state">${ICONS.sales}<div>No sales in this period</div></div></td></tr>`}
      </tbody>
    </table>
    ${list.length>0 ? `<div style="padding:14px 18px;border-top:1px solid var(--line);font-size:13px;font-weight:700;text-align:right;">Total: ${money(total)}</div>` : ''}
  `;
}
function settleBalance(saleId){
  const sale = DB.sales.find(s=>s.id===saleId);
  if(!sale || !(sale.balanceDue>0)) return;
  if(!confirm(`Mark the ${money(sale.balanceDue)} balance on ${saleId} as fully paid?`)) return;
  const cust = DB.customers.find(c=>c.id===sale.customerId);
  const settledAmount = sale.balanceDue;
  if(cust){ cust.balance = Math.max(0, (cust.balance||0) - settledAmount); cust.updatedAt = Date.now(); }
  sale.amountPaid = sale.total;
  sale.balanceDue = 0;
  sale.paymentStatus = 'paid';
  sale.updatedAt = Date.now();
  const now = Date.now();
  DB.customerPayments.push({id:uid('cp'), customerId:sale.customerId, customerName:cust?cust.name:'—', amount:settledAmount, method:'cash', note:'Quick-settled from Sales History ('+saleId+')', appliedTo:[{saleId, amount:settledAmount}], recordedBy:currentUser.name, createdAt:now, updatedAt:now});
  saveDB();
  toast('Balance marked as settled','success');
  renderSalesTable();
}
function voidSale(saleId){
  const sale = DB.sales.find(s=>s.id===saleId);
  if(!sale || sale.voided) return;
  if(!confirm(`Void sale ${saleId}? This will restore stock for all items. This cannot be undone.`)) return;
  sale.voided = true;
  sale.voidedBy = currentUser.name;
  sale.voidedAt = Date.now();
  sale.updatedAt = Date.now();
  if(sale.balanceDue>0){
    const cust = DB.customers.find(c=>c.id===sale.customerId);
    if(cust){ cust.balance = Math.max(0, (cust.balance||0) - sale.balanceDue); cust.updatedAt = Date.now(); }
  }
  sale.items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      p.stock += it.qty;
      p.updatedAt = Date.now();
      logMovement(p.id, p.name, 'IN', it.qty, 'Void '+sale.id);
    }
  });
  saveDB();
  toast('Sale voided, stock restored','info');
  renderSalesTable();
}

      <div style="font-size:11.5px;color:var(--ink-dim);">This will be applied to their oldest outstanding sales first. You can pay off the balance in full or in parts, whenever they come back to pay.</div>
    </div>

function saveCustomerPayment(customerId){
  const c = DB.customers.find(x=>x.id===customerId);
  const amount = parseFloat(document.getElementById('cp-amount').value)||0;
  const method = document.getElementById('cp-method').value;
  const note = document.getElementById('cp-note').value.trim();
  if(!c || amount<=0){ toast('Enter a valid amount','error'); return; }
  if(amount > (c.balance||0)){ toast(`That's more than they owe (${money(c.balance)}). Enter an amount up to that.`,'error'); return; }

  // Apply FIFO across this customer's outstanding sales, oldest first
  const outstanding = DB.sales.filter(s=>s.customerId===customerId && !s.voided && (s.balanceDue||0)>0).sort((a,b)=>a.createdAt-b.createdAt);
  let remaining = amount;
  const appliedTo = [];
  for(const sale of outstanding){
    if(remaining<=0) break;
    const applied = Math.min(remaining, sale.balanceDue);
    sale.balanceDue -= applied;
    sale.amountPaid += applied;
    sale.paymentStatus = sale.balanceDue<=0 ? 'paid' : 'partial';
    sale.updatedAt = Date.now();
    appliedTo.push({saleId:sale.id, amount:applied});
    remaining -= applied;
  }
  c.balance = Math.max(0, (c.balance||0) - amount);
  c.updatedAt = Date.now();

  const now = Date.now();
  DB.customerPayments.push({id:uid('cp'), customerId, customerName:c.name, amount, method, note, appliedTo, recordedBy:currentUser.name, createdAt:now, updatedAt:now});
  saveDB();
  closeModal();
  toast('Payment recorded','success');
  renderCustomers();
}

function voidSupply(id){
  const sup = DB.supplies.find(x=>x.id===id);
  if(!sup || sup.voided) return;
  if(!confirm(`Void delivery ${sup.id} from ${sup.supplierName}? This will remove the stock it added and reverse any credit owed. This cannot be undone.`)) return;
  const now = Date.now();
  const lowStockWarnings = [];
  sup.items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    if(p){
      p.stock -= it.qty;
      p.updatedAt = now;
      logMovement(p.id, p.name, 'OUT', it.qty, 'Void of supply '+sup.id);
      if(p.stock<0) lowStockWarnings.push(p.name);
    }
  });
  if(sup.credit>0){
    const supplier = DB.suppliers.find(x=>x.id===sup.supplierId);
    if(supplier){ supplier.balance = Math.max(0, (supplier.balance||0) - sup.credit); supplier.updatedAt = now; }
  }
  sup.voided = true;
  sup.voidedBy = currentUser.name;
  sup.voidedAt = now;
  sup.updatedAt = now;
  saveDB();
  toast(lowStockWarnings.length ? `Delivery voided — stock now negative for: ${lowStockWarnings.join(', ')}` : 'Delivery voided, stock reversed', lowStockWarnings.length?'error':'info');
  renderSuppliers();
}

/* ---------------- RECORD SUPPLY DELIVERY ----------------
   Recording a delivery: increases stock directly, logs a linked
   stock movement per product, and is tracked as a cost that reduces
   Net Position in Reports (separate from expenses/salaries). */
let supplyDraftItems = [];

function openSupplyModal(preselectedSupplierId){
  const activeSuppliers = DB.suppliers.filter(s=>!s.deleted);
  if(activeSuppliers.length===0){ toast('Add a supplier first','error'); return; }

    <div class="modal-body">
      <div class="field-row">

          <select id="sup-supplier">${activeSuppliers.map(s=>`<option value="${s.id}" ${preselectedSupplierId===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
        </div>

      </div>
      <label style="font-size:11.5px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:6px;">Products Delivered</label>
      <div id="supply-lines"></div>
      <button class="btn btn-ghost btn-sm" onclick="addSupplyLine()" style="margin-top:8px;">${ICONS.plus} Add product line</button>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-dim);margin:16px 0 4px;cursor:pointer;">
        <input type="checkbox" id="sup-update-cost" checked style="width:15px;height:15px;">
        Update these products' cost price to match this delivery
      </label>
      <div class="sum-row total" style="margin-top:10px;margin-bottom:16px;"><span>Total Delivery Cost</span><span id="supply-total">0 XAF</span></div>

      <label style="font-size:11.5px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:8px;">How Is This Delivery Being Paid?</label>
      <div class="field">
        <label>Covered by Bonus / Free Stock (XAF)</label>
        <input type="number" id="sup-bonus" min="0" value="0" oninput="updateSupplyPaymentSplit()">
      </div>
      <div class="field-row">
        <div class="field"><label>Paid Now</label><input type="number" id="sup-paid-now" min="0" value="0" oninput="this.dataset.touched='1';updateSupplyPaymentSplit()"></div>
        <div class="field"><label>Method</label>
          <select id="sup-paid-method">
            <option value="cash">Cash</option>

          </select>

      </div>

      <div id="supply-split-warning" style="font-size:11px;color:var(--red-500);margin-top:4px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-teal" onclick="saveSupply()">${ICONS.check} Record Delivery & Update Stock</button>
    </div>
  `);
  renderSupplyLines();
}

function getSupplyGrandTotal(){
  return supplyDraftItems.reduce((s,l)=>s+(l.qty*l.unitCost),0);
}
function updateSupplyPaymentSplit(){
  const total = getSupplyGrandTotal();
  const bonus = parseFloat(document.getElementById('sup-bonus')?.value)||0;
  const paidNow = parseFloat(document.getElementById('sup-paid-now')?.value)||0;
  const credit = total - bonus - paidNow;
  const creditEl = document.getElementById('supply-credit-display');
  const warnEl = document.getElementById('supply-split-warning');
  if(creditEl){
    creditEl.textContent = money(Math.max(credit,0));
    creditEl.style.color = credit<0 ? 'var(--red-500)' : credit>0 ? 'var(--amber-600)' : 'var(--green-500)';
  }
  if(warnEl) warnEl.textContent = credit<0 ? `Bonus + Paid Now is ${money(Math.abs(credit))} more than the delivery total — adjust the split.` : '';
}

function renderSupplyLines(){
  const wrap = document.getElementById('supply-lines');
  if(!wrap) return;
  const activeProducts = DB.products.filter(p=>p.active!==false);
  wrap.innerHTML = supplyDraftItems.map((line,i)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
      <select style="flex:2;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;" onchange="setSupplyLineProduct(${i}, this.value)">
        <option value="">Select product…</option>
        ${activeProducts.map(p=>`<option value="${p.id}" ${line.productId===p.id?'selected':''}>${p.name}</option>`).join('')}
      </select>
      <input type="number" min="1" value="${line.qty}" placeholder="Qty" style="width:70px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;" oninput="updateSupplyLine(${i},'qty',this.value)">
      <input type="number" min="0" value="${line.unitCost}" placeholder="Unit cost" style="width:100px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;" oninput="updateSupplyLine(${i},'unitCost',this.value)">
      <span id="supply-line-total-${i}" style="width:90px;text-align:right;font-weight:700;font-size:12.5px;">${money(line.qty*line.unitCost)}</span>
      <button class="icon-btn" onclick="removeSupplyLine(${i})">${ICONS.x}</button>
    </div>
  `).join('');
  updateSupplyGrandTotal();
}
function setSupplyLineProduct(i, productId){
  supplyDraftItems[i].productId = productId;
  const p = DB.products.find(x=>x.id===productId);
  if(p && !supplyDraftItems[i].unitCost){ supplyDraftItems[i].unitCost = p.costPrice; }
  renderSupplyLines();
}
function updateSupplyLine(i, field, value){
  supplyDraftItems[i][field] = parseFloat(value)||0;
  const line = supplyDraftItems[i];
  const lineTotalEl = document.getElementById('supply-line-total-'+i);
  if(lineTotalEl) lineTotalEl.textContent = money(line.qty*line.unitCost);
  updateSupplyGrandTotal();
}
function updateSupplyGrandTotal(){
  const total = getSupplyGrandTotal();
  const el = document.getElementById('supply-total');
  if(el) el.textContent = money(total);
  const paidNowEl = document.getElementById('sup-paid-now');
  if(paidNowEl && paidNowEl.dataset.touched!=='1'){
    paidNowEl.value = total;
  }
  updateSupplyPaymentSplit();
}
function addSupplyLine(){
  supplyDraftItems.push({productId:'', qty:1, unitCost:0});
  renderSupplyLines();
}
function removeSupplyLine(i){
  if(supplyDraftItems.length<=1){ toast('At least one product line is required','error'); return; }
  supplyDraftItems.splice(i,1);
  renderSupplyLines();
}
function saveSupply(){
  const supplierId = document.getElementById('sup-supplier').value;
  const supplier = DB.suppliers.find(s=>s.id===supplierId);
  const date = document.getElementById('sup-date').value || new Date().toISOString().slice(0,10);
  const updateCost = document.getElementById('sup-update-cost').checked;
  if(!supplier){ toast('Select a supplier','error'); return; }

  const validLines = supplyDraftItems.filter(l=>l.productId && l.qty>0);
  if(validLines.length===0){ toast('Add at least one product with a quantity','error'); return; }

  const now = Date.now();
  const supplyId = uid('sup');
  const items = [];
  let totalCost = 0;

  validLines.forEach(line=>{
    const p = DB.products.find(x=>x.id===line.productId);
    if(!p) return;
    const lineTotal = line.qty * line.unitCost;
    totalCost += lineTotal;
    items.push({productId:p.id, name:p.name, qty:line.qty, unitCost:line.unitCost, lineTotal});
    p.stock += line.qty;
    if(updateCost && line.unitCost>0) p.costPrice = line.unitCost;
    p.updatedAt = now;
    logMovement(p.id, p.name, 'IN', line.qty, `Supply from ${supplier.name} (${supplyId})`);
  });

  const bonus = parseFloat(document.getElementById('sup-bonus').value)||0;
  const paidNow = parseFloat(document.getElementById('sup-paid-now').value)||0;
  const paidMethod = document.getElementById('sup-paid-method').value;
  const credit = Math.round(totalCost - bonus - paidNow);
  if(credit<0){ toast('Bonus + Paid Now is more than the delivery total — adjust the split before saving','error'); return; }
  const recordedCost = paidNow + credit; // the actual financial cost, excluding free bonus stock

  DB.supplies.push({
    id:supplyId, supplierId:supplier.id, supplierName:supplier.name,
    items, totalCost, bonus, paidNow, paidMethod, credit, recordedCost,
    date, recordedBy:currentUser.name, createdAt:now, updatedAt:now
  });
  if(credit>0){
    supplier.balance = (supplier.balance||0) + credit;
    supplier.updatedAt = now;
  }
  saveDB();
  closeModal();
  const parts = [];
  if(bonus>0) parts.push(`${money(bonus)} bonus`);
  if(paidNow>0) parts.push(`${money(paidNow)} paid`);
  if(credit>0) parts.push(`${money(credit)} on credit`);
  toast(`Delivery recorded — stock updated (${parts.join(' + ')})`,'success');
  renderSuppliers();
}

  saveDB();
  renderExpenses();
}
function deleteExpenseCategory(cat){
  if(DB.expenses.some(e=>e.category===cat && !e.deleted)){ toast('Cannot delete — expenses use this category','error'); return; }

  DB.meta.settingsUpdatedAt = Date.now();
  saveDB();
  renderExpenses();
}

let reportsTab = 'overview';

function renderReports(){
  const view = document.getElementById('view');

  `;
  if(reportsTab==='daily') renderDailySummary();
  else renderReportsOverview();

function renderDailySummary(){
  const wrap = document.getElementById('reports-content');
  const dayStart = new Date(reportsSelectedDate+'T00:00:00').getTime();
  const dayEnd = dayStart + 24*60*60*1000;
  const daySales = DB.sales.filter(s=>saleDisplayTime(s)>=dayStart && saleDisplayTime(s)<dayEnd);
  const validDaySales = daySales.filter(s=>!s.voided);
  const voidedCount = daySales.length - validDaySales.length;

  const grossRevenue = validDaySales.reduce((s,x)=>s+x.total,0);
  const collected = validDaySales.reduce((s,x)=>s+(x.amountPaid!=null?x.amountPaid:x.total),0);
  const outstanding = validDaySales.reduce((s,x)=>s+(x.balanceDue||0),0);
  const incompleteSales = validDaySales.filter(s=>(s.balanceDue||0)>0);

  const payBreakdown = {cash:0, momo:0, om:0};
  validDaySales.forEach(s=>{ payBreakdown[s.paymentMethod] = (payBreakdown[s.paymentMethod]||0) + (s.amountPaid!=null?s.amountPaid:s.total); });

  const dayCost = validDaySales.reduce((s,sale)=>s+sale.items.reduce((ss,it)=>{
    const p = DB.products.find(x=>x.id===it.productId);
    return ss + (p?p.costPrice:0)*it.qty;
  },0),0);
  const estProfit = grossRevenue - dayCost;

  const itemsSold = validDaySales.reduce((n,s)=>n+s.items.reduce((m,i)=>m+i.qty,0),0);

  wrap.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <label style="font-size:12px;font-weight:700;color:var(--ink-dim);">SELECT DATE</label>
        <input type="date" value="${reportsSelectedDate}" onchange="reportsSelectedDate=this.value;renderReports();" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;">
        <button class="btn btn-ghost btn-sm" onclick="reportsSelectedDate=new Date().toISOString().slice(0,10);renderReports();">Today</button>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-ghost" onclick="exportDailySummaryCSV()">${ICONS.download} Export This Summary (CSV)</button>
          <button class="btn btn-ghost" onclick="openReportPreview('Daily Sales Summary', buildDailySummaryReportHtml())">${ICONS.search} View Report</button>
          <button class="btn btn-teal" onclick="printReportHtml(buildDailySummaryReportHtml())">${ICONS.print} Print</button>
        </div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Gross Sales</div><div class="stat-value">${money(grossRevenue)}</div><div class="stat-delta" style="color:var(--ink-dim);">${validDaySales.length} transaction${validDaySales.length!==1?'s':''} · ${itemsSold} items</div></div>
      <div class="stat-card"><div class="stat-label">Cash Collected</div><div class="stat-value">${money(collected)}</div><div class="stat-delta" style="color:var(--ink-dim);">actually received today</div></div>
      <div class="stat-card"><div class="stat-label">Outstanding (Incomplete)</div><div class="stat-value" style="color:${outstanding>0?'var(--amber-600)':'var(--ink)'}">${money(outstanding)}</div><div class="stat-delta" style="color:var(--ink-dim);">${incompleteSales.length} incomplete sale${incompleteSales.length!==1?'s':''}</div></div>
      <div class="stat-card"><div class="stat-label">Est. Profit</div><div class="stat-value">${money(estProfit)}</div><div class="stat-delta" style="color:var(--ink-dim);">${voidedCount>0?voidedCount+' voided (excluded)':'based on cost price'}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      <div class="card">
        <div class="card-head"><div class="card-title">Collected by Payment Method</div></div>
        <div class="card-body">
          <div class="sum-row"><span>Cash</span><span style="font-weight:700;">${money(payBreakdown.cash||0)}</span></div>
          <div class="sum-row"><span>MTN MoMo</span><span style="font-weight:700;">${money(payBreakdown.momo||0)}</span></div>
          <div class="sum-row"><span>Orange Money</span><span style="font-weight:700;">${money(payBreakdown.om||0)}</span></div>
          <div class="sum-row total"><span>Total Collected</span><span>${money(collected)}</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Reconciliation</div></div>
        <div class="card-body">
          <div class="sum-row"><span>Gross Sales</span><span style="font-weight:700;">${money(grossRevenue)}</span></div>
          <div class="sum-row"><span>− Outstanding balances</span><span style="font-weight:700;color:var(--amber-600);">− ${money(outstanding)}</span></div>
          <div class="sum-row total"><span>= Collected</span><span>${money(collected)}</span></div>
        </div>
      </div>

function getOverviewData(range){
  const inR = t=>inRange(t, range);
  const validSales = DB.sales.filter(s=>!s.voided && inR(saleDisplayTime(s)));
  const voidedCount = DB.sales.filter(s=>s.voided && inR(saleDisplayTime(s))).length;
  const totalRevenue = validSales.reduce((s,x)=>s+x.total,0);
  const totalCost = validSales.reduce((s,sale)=>s+sale.items.reduce((ss,it)=>{
    const p = DB.products.find(x=>x.id===it.productId);
    return ss + (p?p.costPrice:0)*it.qty;
  },0),0);
  const totalProfit = totalRevenue - totalCost;
  const collected = validSales.reduce((s,x)=>s+(x.amountPaid!=null?x.amountPaid:x.total),0);
  const itemsSold = validSales.reduce((n,s)=>n+s.items.reduce((m,i)=>m+i.qty,0),0);
  const inventoryValue = DB.products.filter(p=>p.active!==false).reduce((s,p)=>s+p.costPrice*p.stock,0);
  const totalOutstanding = validSales.reduce((s,x)=>s+(x.balanceDue||0),0);
  const expenses = DB.expenses.filter(e=>!e.deleted && inR(recordTime(e)));
  const totalExpenses = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
  const totalSalaries = DB.salaryPayments.filter(sp=>inR(recordTime(sp))).reduce((s,sp)=>s+Number(sp.amountPaid||0),0);
  const supplies = DB.supplies.filter(x=>!x.voided && inR(recordTime(x)));
  const totalSupplyRecordedCost = supplies.reduce((s,x)=>s+(x.recordedCost!=null?x.recordedCost:x.totalCost),0);
  const totalSupplyBonus = supplies.reduce((s,x)=>s+(x.bonus||0),0);
  const totalSupplierCredit = DB.suppliers.filter(s=>!s.deleted).reduce((s,x)=>s+(x.balance||0),0);
  const cashInHand = DB.cashAdjustments.filter(c=>!c.deleted && inR(recordTime(c))).reduce((s,c)=>s+Number(c.amount||0),0);
  const netPosition = cashInHand + totalRevenue - totalExpenses - totalSalaries - totalSupplyRecordedCost;
  const paymentBreakdown = {cash:0, momo:0, om:0, credit:0};
  validSales.forEach(s=>{ paymentBreakdown[s.paymentMethod] = (paymentBreakdown[s.paymentMethod]||0) + (s.amountPaid!=null?s.amountPaid:s.total); });

  const catTotals = {}, prodTotals = {};
  validSales.forEach(s=>s.items.forEach(it=>{
    const p = DB.products.find(x=>x.id===it.productId);
    const cat = p?p.category:'Other';
    catTotals[cat] = (catTotals[cat]||0) + it.price*it.qty;
    const k = it.productId||it.name;
    if(!prodTotals[k]) prodTotals[k] = {name:it.name||(p?p.name:'—'), qty:0, revenue:0};
    prodTotals[k].qty += it.qty;
    prodTotals[k].revenue += it.price*it.qty;
  }));
  const catList = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const topProducts = Object.values(prodTotals).sort((a,b)=>b.revenue-a.revenue);
  const expByCat = {};
  expenses.forEach(e=>{ expByCat[e.category] = (expByCat[e.category]||0) + Number(e.amount||0); });
  const expList = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  const moves = DB.movements.filter(m=>inR(m.createdAt));
  const unitsIn = moves.filter(m=>mvDelta(m)>0).reduce((s,m)=>s+mvDelta(m),0);
  const unitsOut = moves.filter(m=>mvDelta(m)<0).reduce((s,m)=>s-mvDelta(m),0);
  return {validSales, voidedCount, totalRevenue, totalCost, totalProfit, collected, itemsSold, inventoryValue, totalOutstanding,
    totalExpenses, totalSalaries, totalSupplyRecordedCost, totalSupplyBonus, totalSupplierCredit, cashInHand, netPosition,
    paymentBreakdown, catList, topProducts, expList, supplies, moveCount:moves.length, unitsIn, unitsOut};
}

function exportCSV(type){
  let rows = [];
  // dated records follow the time frame chosen on the Reports page
  const range = periodRange(rptFilter);
  const inR = t=>inRange(t, range);
  if(type==='sales'){
    rows.push(['Receipt','Date','Items','Total (XAF)','Payment Method','Amount Paid','Balance Owed','Cashier','Status']);
    DB.sales.filter(s=>inR(saleDisplayTime(s))).forEach(s=>rows.push([s.id, new Date(saleDisplayTime(s)).toLocaleString('en-GB'), s.items.reduce((n,i)=>n+i.qty,0), s.total, s.paymentMethod, s.amountPaid!=null?s.amountPaid:s.total, s.balanceDue||0, s.cashierName, s.voided?'Voided':'Completed']));
  }else if(type==='products'){
    rows.push(['Name','Category','SKU','Cost Price','Sell Price','Stock','Reorder Level']);
    DB.products.filter(p=>p.active!==false).forEach(p=>rows.push([p.name, p.category, p.sku, p.costPrice, p.sellPrice, p.stock, p.reorderLevel]));
  }else if(type==='movements'){
    rows.push(['Date','Product','Type','Qty','Reason','User']);
    DB.movements.filter(m=>inR(m.createdAt)).forEach(m=>rows.push([new Date(m.createdAt).toLocaleString('en-GB'), m.productName, m.type, m.qty, m.reason, m.userName]));
  }else if(type==='expenses'){
    rows.push(['Date','Description','Category','Vendor','Method','Amount (XAF)','Recorded By']);
    DB.expenses.filter(e=>!e.deleted && inR(recordTime(e))).forEach(e=>rows.push([recordDateLabel(e), e.description, e.category, e.vendor||'', e.method, e.amount, e.recordedBy]));
  }else if(type==='payroll'){
    rows.push(['Staff','Month','Amount Due','Amount Paid','Method','Date','Recorded By']);
    DB.salaryPayments.filter(sp=>inR(recordTime(sp))).forEach(sp=>{
      const st = DB.staff.find(x=>x.id===sp.staffId);
      rows.push([st?st.name:'—', sp.month, sp.amountDue, sp.amountPaid, sp.method, new Date(sp.createdAt).toLocaleString('en-GB'), sp.recordedBy]);
    });
  }else if(type==='supplies'){
    rows.push(['Date','Supplier','Product','Qty','Unit Cost','Line Total','Delivery Total','Bonus','Paid Now','Credit','Recorded By','Status']);
    DB.supplies.filter(sup=>inR(recordTime(sup))).forEach(sup=>{
      sup.items.forEach(it=>{
        rows.push([sup.date, sup.supplierName, it.name, it.qty, it.unitCost, it.lineTotal, sup.totalCost, sup.bonus||0, sup.paidNow||0, sup.credit||0, sup.recordedBy, sup.voided?'Voided':'Active']);
      });
    });
  }else if(type==='customerPayments'){
    rows.push(['Date','Customer','Amount','Method','Note','Recorded By']);
    DB.customerPayments.filter(p=>inR(p.createdAt)).forEach(p=>rows.push([new Date(p.createdAt).toLocaleString('en-GB'), p.customerName, p.amount, p.method, p.note||'', p.recordedBy]));
  }else if(type==='supplierPayments'){
    rows.push(['Date','Supplier','Amount','Method','Note','Recorded By']);
    DB.supplierPayments.filter(p=>inR(p.createdAt)).forEach(p=>rows.push([new Date(p.createdAt).toLocaleString('en-GB'), p.supplierName, p.amount, p.method, p.note||'', p.recordedBy]));
  }else if(type==='cashAdjustments'){
    rows.push(['Date','Amount','Note','Recorded By']);
    DB.cashAdjustments.filter(c=>!c.deleted && inR(recordTime(c))).forEach(c=>rows.push([recordDateLabel(c), c.amount, c.note||'', c.recordedBy]));
  }
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `nexora-${type}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Export downloaded','success');
}

/* ---------------- IMPORT / RESTORE BACKUP ---------------- */
let pendingImportData = null;

function triggerImportFile(){
  document.getElementById('import-file-input').click();
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast('That file is not valid JSON','error'); input.value=''; return; }
    if(!data || typeof data!=='object' || !Array.isArray(data.products) || !Array.isArray(data.sales) || !data.meta){
      toast("That doesn't look like a Nexora POS backup file",'error');
      input.value=''; return;
    }
    pendingImportData = data;
    showImportConfirm(data);
    input.value = '';
  };
  reader.onerror = ()=>{ toast('Could not read that file','error'); input.value=''; };
  reader.readAsText(file);
}

function showImportConfirm(data){
  const c = {
    products:(data.products||[]).length,
    sales:(data.sales||[]).length,

  openModal(`

        <div class="stat-card"><div class="stat-label">Sales</div><div class="stat-value" style="font-size:20px;">${c.sales}</div></div>
        <div class="stat-card"><div class="stat-label">Customers</div><div class="stat-value" style="font-size:20px;">${c.customers}</div></div>

      </div>
      <div class="field">
        <label>How should this be applied?</label>

            <input type="radio" name="import-mode" value="merge" checked style="margin-top:3px;">
            <span><strong>Merge with current data</strong><br><span style="font-weight:500;color:var(--ink-dim);">Combines with what's already on this device. If the same record exists in both, the most recently updated version is kept. Nothing is deleted.</span></span>
          </label>
          <label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;font-weight:600;cursor:pointer;">

            <span style="color:var(--red-500);"><strong>Replace everything</strong><br><span style="font-weight:500;">Erases all current data on this device and uses only what's in this file. Cannot be undone.</span></span>
